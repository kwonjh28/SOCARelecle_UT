<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>쏘카일레클 UT 테스트</title>
    <style>
      :root {
        --bg: #f4f6fa;
        --surface: #ffffff;
        --ink: #151923;
        --muted: #667085;
        --line: #d8dee9;
        --soft: #eef3f8;
        --accent: #0677ff;
        --accent-weak: #e9f2ff;
        --ok: #12b76a;
        --danger: #f04438;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        zoom: 1;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 12px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.25;
        font-weight: 760;
      }

      .subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .progress {
        min-width: 300px;
      }

      .progress-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .progress-track {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--soft);
      }

      .progress-fill {
        width: 16.66%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 180ms ease;
      }

      main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(380px, 1fr);
      }

      .stage {
        min-width: 0;
        min-height: 0;
        padding: 18px;
      }

      .surface {
        height: calc(100vh - 100px);
        min-height: 560px;
        overflow: hidden;
        background: #111827;
        border: 1px solid #101828;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(16, 24, 40, 0.16);
      }

      .figma-shell {
        --figma-scale: 0.8;
        --figma-size: 125%;
        --figma-footer-crop: 64px;
        position: relative;
      }

      iframe {
        position: absolute;
        inset: 0;
        width: var(--figma-size);
        height: calc(var(--figma-size) + var(--figma-footer-crop));
        border: 0;
        display: block;
        background: white;
        transform: scale(var(--figma-scale));
        transform-origin: top left;
      }

      .prototype-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.68);
        color: white;
        text-align: center;
      }

      .prototype-overlay p {
        max-width: min(860px, calc(100% - 48px));
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        line-height: 1.7;
      }

      .image-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 28px 18px;
        background: #3f3f3f;
      }

      .reference-img {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .image-pair {
        width: min(100%, 760px);
        height: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        align-items: center;
        justify-items: center;
      }

      .image-option {
        min-width: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-items: center;
        align-items: center;
        justify-content: center;
      }

      .image-option img {
        display: block;
        width: auto;
        max-width: min(100%, 360px);
        height: auto;
        max-height: min(760px, calc(100vh - 230px));
        min-height: 0;
        object-fit: contain;
      }

      .image-option-label {
        flex: 0 0 40px;
        color: white;
        font-size: 28px;
        font-weight: 500;
        line-height: 40px;
      }

      aside {
        min-height: 0;
        padding: 18px 18px 18px 0;
      }

      .panel {
        height: calc(100vh - 100px);
        min-height: 560px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 24px;
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 13px;
        font-weight: 760;
      }

      .panel h2 {
        margin: 4px 0 0;
        font-size: 22px;
        line-height: 1.35;
      }

      .panel p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .condition {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfe;
        color: #344054;
        font-size: 16px;
        line-height: 1.55;
      }

      .options {
        display: grid;
        gap: 10px;
      }

      .choice {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        cursor: pointer;
        font-size: 17px;
        font-weight: 720;
      }

      .choice:hover,
      .choice:focus-visible,
      .choice.is-selected {
        outline: none;
        border-color: var(--accent);
        background: var(--accent-weak);
      }

      .choice.is-selected::after {
        content: "선택됨";
        color: var(--accent);
        font-size: 14px;
        font-weight: 760;
      }

      .field {
        display: grid;
        gap: 10px;
      }

      .field label {
        color: #344054;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
      }

      .profile-fields {
        display: grid;
        gap: 60px;
      }

      .profile-fields .ab-picker {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }

      .profile-fields .field {
        gap: 14px;
      }

      .profile-fields .field + .field {
        padding-top: 0;
      }

      .profile-fields .field label {
        font-size: 17px;
        font-weight: 680;
      }

      .profile-fields .choice {
        min-height: 54px;
        font-size: 16px;
        font-weight: 640;
      }

      .profile-fields .ab-picker .choice {
        font-size: 17px;
        font-weight: 650;
      }

      .profile-fields .choice.is-selected::after {
        font-size: 13px;
        font-weight: 700;
      }

      input[type="text"],
      input[type="number"],
      textarea {
        min-height: 104px;
        width: 100%;
        resize: vertical;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: white;
      }

      input[type="text"],
      input[type="number"] {
        min-height: 52px;
        resize: none;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      textarea:focus {
        outline: 2px solid rgba(6, 119, 255, 0.16);
        border-color: var(--accent);
      }

      .ab-picker {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .ab-picker .choice {
        justify-content: center;
        min-height: 62px;
        font-size: 22px;
        font-weight: 800;
      }

      .message {
        min-height: 18px;
        color: var(--danger);
        font-size: 14px;
        line-height: 1.5;
      }

      .actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
      }

      .actions button,
      .actions a {
        min-height: 42px;
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        text-decoration: none;
        font-size: 15px;
        font-weight: 760;
        cursor: pointer;
      }

      .actions .primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
      }

      .actions button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .complete {
        display: grid;
        place-items: center;
        padding: 24px;
        background: white;
      }

      .ready {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
      }

      .intro-list {
        margin: 20px 0 0;
        padding-left: 20px;
        color: var(--muted);
        text-align: left;
        line-height: 1.7;
      }

      .complete-box {
        max-width: 520px;
        text-align: center;
      }

      .complete-box h2 {
        margin: 0;
        font-size: 24px;
      }

      .complete-box p {
        color: var(--muted);
        line-height: 1.6;
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }

        .progress {
          min-width: 220px;
        }

        aside {
          padding: 0 18px 18px;
        }

        .surface,
        .panel {
          height: auto;
          min-height: 560px;
        }
      }

      @media (max-width: 640px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          padding: 14px 16px;
        }

        .progress {
          width: 100%;
          min-width: 0;
        }

        .stage,
        aside {
          padding: 12px;
        }

        .surface,
        .panel {
          min-height: 72vh;
        }

        .figma-shell {
          --figma-scale: 0.74;
          --figma-size: 135.135%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="mark">UT</div>
          <div>
            <h1>쏘카일레클 사용성 테스트</h1>
            <div class="subtitle">Prototype UT + predictability + A/B test</div>
          </div>
        </div>
        <div class="progress" aria-label="진행률">
          <div class="progress-meta">
            <span id="stepLabel">참여자 정보</span>
            <span id="countLabel">1 / 9</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </header>

      <main>
        <section class="stage" aria-label="테스트 자료">
          <div id="visual" class="surface figma-shell"></div>
        </section>

        <aside aria-label="응답 패널">
          <form class="panel" id="panel"></form>
        </aside>
      </main>
    </div>

    <script>
      const sheetsWebAppUrl =
        "https://script.google.com/macros/s/AKfycbyhH7mLLVLVGke6ztjG1DZoAMrjWv2x-FhHWiUd-X6KCWbCKeu_dmTxI7qyfAcLRKk/exec";
      const sheetsSecret = "socar-elecle-ut-2026";

      const figmaSources = {

        phase1B:

        phase2:

      };

      const steps = [
        {
          id: "profile",
          phase: "참여자 정보",
          count: "1 / 9",
          visual: { type: "intro" },
          title: "참여자 정보 입력",
          description:
            "리서치 시작 전, 결과 분석을 위해 기본 정보를 입력해주세요. 모든 항목을 입력하면 테스트를 시작할 수 있습니다.",
          type: "profile",

        {

        {

          description:

          key: "phase4_qr_choice",

        },
        {
          id: "phase4_bike",
          phase: "Phase 4-2",
          count: "7 / 9",

            type: "imagePair",
            items: [

        {

          key: "phase4_riding_choice",
          reasonKey: "phase4_riding_reason",

        },
        {
          id: "complete",
          phase: "완료",
          count: "9 / 9",
          visual: { type: "complete" },

          description: "참여해주셔서 감사합니다. 응답은 자동으로 저장됩니다.",

      const state = {
        index: 0,
        participantId:
          globalThis.crypto?.randomUUID?.() ||
          `participant-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        answers: {},
        started: {},
        startedAt: {},
        elapsedSeconds: {},
        sheetsSaveRequested: false,
      };

      const visual = document.querySelector("#visual");
      const panel = document.querySelector("#panel");
      const stepLabel = document.querySelector("#stepLabel");
      const countLabel = document.querySelector("#countLabel");
      const progressFill = document.querySelector("#progressFill");

      function render() {
        const step = steps[state.index];
        stepLabel.textContent = step.phase;
        countLabel.textContent = step.count;
        progressFill.style.width = `${((state.index + 1) / steps.length) * 100}%`;
        renderVisual(step);
        renderPanel(step);
      }

      function renderVisual(step) {
        visual.className = "surface";
        if (step.visual.type === "intro") {
          visual.classList.add("ready");
          visual.innerHTML = `
            <div class="complete-box">
              <h2>리서치 참여에 감사드립니다</h2>
              <p>원활한 진행을 위해 화면 확대비율을 100%로 맞춘 뒤 오른쪽 참여자 정보를 입력해주세요.</p>
            </div>
          `;
          return;
        }

        if (step.visual.type === "figma") {
          visual.classList.add("figma-shell");
          const currentFrame = visual.querySelector("iframe");
          if (!currentFrame || currentFrame.getAttribute("src") !== step.visual.src) {
            visual.innerHTML = `<iframe title="쏘카일레클 Figma prototype" allowfullscreen allow="fullscreen" src="${step.visual.src}"></iframe>`;
          }

          if (step.type === "timedSingle" && !state.started[step.timerKey]) {
            if (!visual.querySelector(".prototype-overlay")) {
              visual.insertAdjacentHTML(
                "beforeend",
                `<div class="prototype-overlay">
                  <p>오른쪽 제시문을 충분히 읽고, 해당 영역에 프로토타입이 로드되면<br />시작하기 버튼을 눌러 문제를 풀어주세요. 시작하기 버튼을 누른 순간부터 수행 시간이 측정됩니다.</p>
                </div>`,
              );
            }
            return;
          }

          visual.querySelector(".prototype-overlay")?.remove();
          return;
        }

        if (step.visual.type === "image") {
          visual.classList.add("image-stage");
          visual.innerHTML = `<img class="reference-img" src="${step.visual.src}" alt="${step.visual.alt}" />`;
          return;
        }

        if (step.visual.type === "imagePair") {
          visual.classList.add("image-stage");
          visual.innerHTML = `
            <div class="image-pair">
              ${step.visual.items
                .map(
                  (item) => `
                    <figure class="image-option">
                      <img src="${item.src}" alt="${item.alt}" />
                      <figcaption class="image-option-label">${item.label}</figcaption>
                    </figure>
                  `,
                )
                .join("")}
            </div>
          `;
          return;
        }

        visual.classList.add("complete");
        visual.innerHTML = `
          <div class="complete-box">
            <h2>테스트 종료</h2>
            <p>참여해주셔서 감사합니다. 진행자는 CSV 파일을 다운로드해 응답 데이터를 확인할 수 있습니다.</p>
          </div>
        `;
      }

      function renderPanel(step) {
        const intro = `
          <div>
            <div class="eyebrow">${step.phase}</div>
            <h2>${step.title}</h2>
            <p>${step.description}</p>
          </div>
        `;

        if (step.type === "profile") {
          const hasExperience = state.answers.participant_experience === "있어요";
          panel.innerHTML = `
            ${intro}
            <div class="profile-fields">
              <div class="field">
                <label for="participant_age">1. 나이</label>
                <input id="participant_age" type="number" min="1" inputmode="numeric" data-field="participant_age" placeholder="예: 29" value="${state.answers.participant_age || ""}" />
              </div>
              <div class="field">
                <label>2. 성별</label>
                <div class="ab-picker">
                  ${["남", "여", "기타"]
                    .map(
                      (option) => `
                        <button class="choice ${state.answers.participant_gender === option ? "is-selected" : ""}" type="button" data-key="participant_gender" data-value="${option}">
                          <span>${option}</span>
                        </button>
                      `,
                    )
                    .join("")}
                </div>
              </div>
              <div class="field">
                <label>3. 쏘카일레클/지쿠/카카오바이크 등 공유전기자전거 서비스 이용 경험이 있으신가요?</label>
                <div class="ab-picker">
                  ${["있어요", "없어요"]
                    .map(
                      (option) => `
                        <button class="choice ${state.answers.participant_experience === option ? "is-selected" : ""}" type="button" data-key="participant_experience" data-value="${option}">
                          <span>${option}</span>
                        </button>
                      `,
                    )
                    .join("")}
                </div>
              </div>
              ${
                hasExperience
                  ? `
                    <div class="field">
                      <label>4. 공유전기자전거 서비스를 최근 1개월 동안 얼마나 자주 이용하셨나요?</label>
                      <div class="options">
                        ${[
                          "주 3~4회 이상 이용",
                          "주 1~2회 정도 이용",
                          "월 1~2회 정도 가끔 필요할 때만 이용",
                          "과거에는 활발히 이용했으나, 최근에는 이용하지 않음",
                          "지금까지 한두 번 정도만 타본 경험이 있음",
                        ]
                          .map(
                            (option) => `
                              <button class="choice ${state.answers.participant_frequency === option ? "is-selected" : ""}" type="button" data-key="participant_frequency" data-value="${option}">
                                <span>${option}</span>
                              </button>
                            `,
                          )
                          .join("")}
                      </div>
                    </div>
                  `
                  : ""
              }
              <div class="field">
                <label for="participant_phone">${hasExperience ? "5" : "4"}. 기프티콘 추첨을 원하시는 분은 전화번호를 남겨주세요. (선택)</label>
                <input id="participant_phone" type="tel" inputmode="tel" data-field="participant_phone" placeholder="예: 010-1234-5678" value="${state.answers.participant_phone || ""}" />
              </div>
            </div>
            <div class="message" id="message"></div>
            <div class="actions">
              <button type="button" data-action="prev" disabled>이전</button>
              <button class="primary" type="button" data-action="next">테스트 시작하기</button>
            </div>
          `;
          return;
        }

        if (step.type === "timedSingle") {
          if (!state.started[step.timerKey]) {
            panel.innerHTML = `
              ${intro}
              <div class="message" id="message"></div>
              <div class="actions">
                <button type="button" data-action="prev" ${state.index === 0 ? "disabled" : ""}>이전</button>
                <button class="primary" type="button" data-action="start-task">시작하기</button>
              </div>
            `;
            return;
          }

          panel.innerHTML = `
            ${intro}
            <div class="options">
              ${step.options
                .map(
                  (option) => `
                    <button class="choice ${state.answers[step.key] === option ? "is-selected" : ""}" type="button" data-key="${step.key}" data-value="${option}">
                      <span>${option}</span>
                    </button>
                  `,
                )
                .join("")}
            </div>
            <div class="message" id="message"></div>
            ${actions(state.index > 0)}
          `;
        }

        if (step.type === "single") {
          panel.innerHTML = `
            ${intro}
            <div class="options">
              ${step.options
                .map(
                  (option) => `
                    <button class="choice ${state.answers[step.key] === option ? "is-selected" : ""}" type="button" data-key="${step.key}" data-value="${option}">
                      <span>${option}</span>
                    </button>
                  `,
                )
                .join("")}
            </div>
            <div class="message" id="message"></div>
            ${actions(state.index > 0)}
          `;
        }

        if (step.type === "numberChoices") {
          panel.innerHTML = `
            ${intro}
            ${step.questions
              .map(
                (question) => `
                  <div class="field">
                    <label>${question.label}</label>
                    <div class="ab-picker">
                      ${["1번", "2번"]
                        .map(
                          (option) => `
                            <button class="choice ${state.answers[question.key] === option ? "is-selected" : ""}" type="button" data-key="${question.key}" data-value="${option}">
                              <span>${option}</span>
                            </button>
                          `,
                        )
                        .join("")}
                    </div>
                  </div>
                `,
              )
              .join("")}
            <div class="message" id="message"></div>
            ${actions(true)}
          `;
        }

        if (step.type === "fields") {
          panel.innerHTML = `
            ${intro}
            ${step.fields
              .map(
                (field) => `
                  <div class="field">
                    <label for="${field.key}">${field.label}</label>
                    <textarea id="${field.key}" data-field="${field.key}" placeholder="응답을 입력해주세요.">${state.answers[field.key] || ""}</textarea>
                  </div>
                `,
              )
              .join("")}
            <div class="message" id="message"></div>
            ${actions(true)}
          `;
        }

        if (step.type === "ab") {
          panel.innerHTML = `
            ${intro}
            <div class="ab-picker">
              ${["A", "B"]
                .map(
                  (option) => `
                    <button class="choice ${state.answers[step.key] === option ? "is-selected" : ""}" type="button" data-key="${step.key}" data-value="${option}">
                      <span>${option}</span>
                    </button>
                  `,
                )
                .join("")}
            </div>
            <div class="field">
              <label for="${step.reasonKey}">${step.reasonLabel}</label>
              <textarea id="${step.reasonKey}" data-field="${step.reasonKey}" placeholder="이유를 입력해주세요.">${state.answers[step.reasonKey] || ""}</textarea>
            </div>
            <div class="message" id="message"></div>
            ${actions(true)}
          `;
        }

        if (step.type === "complete") {
          panel.innerHTML = `
            ${intro}
            <div class="condition">Phase 1-A 소요시간: ${state.elapsedSeconds.phase1_a ?? "-"}초<br />Phase 1-B 소요시간: ${state.elapsedSeconds.phase1_b ?? "-"}초<br />Phase 2 소요시간: ${state.elapsedSeconds.phase2_battery ?? "-"}초</div>
            <div class="message" id="message">${state.sheetsSaveRequested ? "응답 저장 요청을 보냈습니다." : "응답을 자동 저장하는 중입니다."}</div>
            <div class="actions">
              <button type="button" data-action="prev">이전</button>
              <button class="primary" type="button" data-action="download">CSV 다운로드</button>
            </div>
          `;
          autoSaveOnComplete();
        }
      }

      function actions(hasPrev) {
        return `
          <div class="actions">
            <button type="button" data-action="prev" ${hasPrev ? "" : "disabled"}>이전</button>
            <button class="primary" type="button" data-action="next">다음</button>
          </div>
        `;
      }

      function setMessage(text) {
        const message = document.querySelector("#message");
        if (message) message.textContent = text;
      }

      function syncFields() {
        document.querySelectorAll("[data-field]").forEach((field) => {
          state.answers[field.dataset.field] = field.value.trim();
        });
      }

      function validate(step) {
        syncFields();

        if (step.type === "profile") {
          if (!state.answers.participant_age) {
            setMessage("나이를 입력해주세요.");
            return false;
          }
          if (!state.answers.participant_gender) {
            setMessage("성별을 선택해주세요.");
            return false;
          }
          if (!state.answers.participant_experience) {
            setMessage("공유전기자전거 서비스 이용 경험을 선택해주세요.");
            return false;
          }
          if (
            state.answers.participant_experience === "있어요" &&
            !state.answers.participant_frequency
          ) {
            setMessage("최근 1개월 이용 빈도를 선택해주세요.");
            return false;
          }
        }

        if ((step.type === "single" || step.type === "timedSingle") && !state.answers[step.key]) {
          setMessage("답변을 선택해주세요.");
          return false;
        }

        if (step.type === "fields") {
          const empty = step.fields.find((field) => !state.answers[field.key]);
          if (empty) {
            setMessage("3개 응답란을 모두 입력해주세요.");
            return false;
          }
        }

        if (step.type === "numberChoices") {
          const empty = step.questions.find((question) => !state.answers[question.key]);
          if (empty) {
            setMessage("3개 문항을 모두 선택해주세요.");
            return false;
          }
        }

        if (step.type === "ab") {
          if (!state.answers[step.key]) {
            setMessage("A 또는 B를 선택해주세요.");
            return false;
          }
          if (!state.answers[step.reasonKey]) {
            setMessage("선택 이유를 입력해주세요.");
            return false;
          }
        }

        setMessage("");
        return true;
      }

      function next() {
        const step = steps[state.index];
        if (!validate(step)) return;

        if (
          step.type === "timedSingle" &&
          state.startedAt[step.timerKey] &&
          state.elapsedSeconds[step.timerKey] == null
        ) {
          state.elapsedSeconds[step.timerKey] = Number(
            ((performance.now() - state.startedAt[step.timerKey]) / 1000).toFixed(2),
          );
        }

        state.index = Math.min(state.index + 1, steps.length - 1);
        render();
      }

      function startTask() {
        const step = steps[state.index];
        if (step.type !== "timedSingle") return;
        state.started[step.timerKey] = true;
        state.startedAt[step.timerKey] = performance.now();
        state.elapsedSeconds[step.timerKey] = null;
        render();
      }

      function prev() {
        syncFields();
        state.index = Math.max(state.index - 1, 0);
        render();
      }

      function downloadCsv() {
        syncFields();
        const headers = responseHeaders();
        const row = buildResponsePayload();
        const csv = [headers, headers.map((key) => row[key] ?? "")]
          .map((line) => line.map(csvCell).join(","))
          .join("\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `socar-elecle-ut-${Date.now()}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      }

      function responseHeaders() {
        return [
          "submitted_at",
          "participant_id",
          "participant_age",
          "participant_gender",
          "participant_experience",
          "participant_frequency",
          "participant_phone",
          "phase1_a_battery_last_digit",
          "phase1_a_elapsed_seconds",
          "phase1_b_battery_last_digit",
          "phase1_b_elapsed_seconds",
          "phase2_battery",
          "phase2_elapsed_seconds",
          "phase3_feedback_button",
          "phase3_urgent_return_button",
          "phase3_help_button",
          "phase4_qr_choice",
          "phase4_qr_reason",
          "phase4_bike_choice",
          "phase4_bike_reason",
          "phase4_riding_choice",
          "phase4_riding_reason",
          "user_agent",
        ];
      }

      function buildResponsePayload() {
        return {
          secret: sheetsSecret,
          submitted_at: localTimestamp(),
          participant_id: state.participantId,
          participant_age: state.answers.participant_age ?? "",
          participant_gender: state.answers.participant_gender ?? "",
          participant_experience: state.answers.participant_experience ?? "",
          participant_frequency: state.answers.participant_frequency ?? "",
          participant_phone: state.answers.participant_phone ?? "",
          phase1_a_elapsed_seconds: state.elapsedSeconds.phase1_a ?? "",
          phase1_b_elapsed_seconds: state.elapsedSeconds.phase1_b ?? "",
          phase2_elapsed_seconds: state.elapsedSeconds.phase2_battery ?? "",
          user_agent: navigator.userAgent,
          ...state.answers,
        };
      }

      function localTimestamp() {
        const date = new Date();
        const parts = new Intl.DateTimeFormat("sv-SE", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).formatToParts(date);
        const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
        return `${values.year}-${values.month}-${values.day} ${values.hour}:${values.minute}:${values.second}`;
      }

      function saveToGoogleSheets() {
        syncFields();
        setMessage("Google Sheets에 저장 요청을 보내는 중입니다.");
        const payload = buildResponsePayload();
        const body = JSON.stringify(payload);
        const blob = new Blob([body], { type: "text/plain;charset=utf-8" });

        if (navigator.sendBeacon && navigator.sendBeacon(sheetsWebAppUrl, blob)) {
          setMessage("저장 요청을 보냈습니다. Google Sheets에서 행이 추가됐는지 확인해주세요.");
          return;
        }

        fetch(sheetsWebAppUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body,
        })
          .then(() => {
            setMessage("저장 요청을 보냈습니다. Google Sheets에서 행이 추가됐는지 확인해주세요.");
          })
          .catch(() => {
            setMessage("자동 저장 요청에 실패했습니다. CSV 다운로드를 백업으로 사용해주세요.");
          });
      }

      function autoSaveOnComplete() {
        if (state.sheetsSaveRequested) return;
        state.sheetsSaveRequested = true;
        window.setTimeout(saveToGoogleSheets, 0);
      }

      function csvCell(value) {
        const text = String(value);
        return `"${text.replaceAll('"', '""')}"`;
      }

      panel.addEventListener("click", (event) => {
        const choice = event.target.closest("[data-key]");
        if (choice) {
          state.answers[choice.dataset.key] = choice.dataset.value;
          if (choice.dataset.key === "participant_experience" && choice.dataset.value === "없어요") {
            state.answers.participant_frequency = "";
          }
          renderPanel(steps[state.index]);
          return;
        }

        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "next") next();
        if (action === "prev") prev();
        if (action === "start-task") startTask();
        if (action === "download") downloadCsv();
      });

      panel.addEventListener("input", syncFields);
      render();
    </script>
  </body>
</html>
